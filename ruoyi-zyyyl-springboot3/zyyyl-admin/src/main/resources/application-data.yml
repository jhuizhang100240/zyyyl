# 配置文件存储
storage:
  primary: MASTER
  buckets:
    MASTER:
      # 指定文件服务类型：local=本地磁盘，oss=阿里云 OSS
      # OSS AccessKey 未配置时自动回退 local，避免部署时启动失败
      type: ${STORAGE_TYPE:local}
      permission: public 
      path: ${UPLOAD_PATH:D:/zyyyl/uploadPath}
      # 建议public权限的api以 /profile开头就不需要再从SecurityConfig配置权限了
      # private需要自己编写一个api例如FileController中的/file/resource
      api: /profile/files/master
      # 以下参数仅在 type=oss 时生效
      accessKeyId: ${OSS_ACCESS_KEY_ID:}
      accessKeySecret: ${OSS_ACCESS_KEY_SECRET:}
      bucketName: ${OSS_BUCKET:zyyyl}
      endpoint: ${OSS_ENDPOINT:}


# 数据池配置
spring:
  liquibase:
    # Development/test environments may run the changelog automatically.
    # Production must set SPRING_LIQUIBASE_ENABLED=false or use a controlled release process.
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:dev}
    drop-first: false
  datasource:
    dynamic:
      primary: MASTER
      datasource:
        MASTER:
            url: ${DB_URL:jdbc:mysql://192.168.100.168:3306/zyyyl?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true}
            username: ${DB_USERNAME:root}
            password: ${DB_PASSWORD:}
            driver-class-name: com.mysql.cj.jdbc.Driver
        # SLAVE:
        #     url: jdbc:postgresql://127.0.0.1/ry
        #     username: postgres
        #     password: 123456
        #     driver-class-name: org.postgresql.Driver

    druid:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      # 配置监控统计拦截的filters  stat=>监控统计 wall=>防SQL注入 slf4j log4j2=>日志记录
      filters: stat,wall,slf4j,log4j2
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

      # 配置spring监控的匹配类
      aop-patterns: com.zyyyl.*.service.*,com.zyyyl.*.mapper.*

      
      # Web应用 和 URL监控 配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: false  # 是否开启session统计功能
          
      # 监控视图配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: true      # 是否可以重置日志
        login-username: ${DRUID_USERNAME:zyyyl}
        login-password: ${DRUID_PASSWORD:}
        allow: ""               # IP白名单 (没有配置或者为空，则允许所有访问)
        deny: ""                # IP黑名单 (存在共同时，deny优先于allow)
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
