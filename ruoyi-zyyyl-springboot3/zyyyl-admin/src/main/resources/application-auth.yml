# 请输入自己的appid和appsecret
oauth:
  wx:
    miniapp:
      appId: ${WECHAT_MINIAPP_APP_ID:}
      appSecret: ${WECHAT_MINIAPP_APP_SECRET:}
      url: https://api.weixin.qq.com/sns/jscode2session
    pub:
      appId: ${WECHAT_PUB_APP_ID:}
      appSecret: ${WECHAT_PUB_APP_SECRET:}
      url: https://api.weixin.qq.com/sns/oauth2/access_token

tfa:
  phone:
    dysms:
      # 阿里云 AccessKey ID
      accessKeyId: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      # 阿里云 AccessKey Secret
      accessKeySecret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      # 短信模板
      template:
          VerificationCode:
            # 短信模板编码
            templateCode: SMS_123456789
            # 短信签名
            signName: 阿里云短信测试
            # 短信模板必需的数据名称，多个key以逗号分隔，此处配置作为校验
            keys: code

justauth:
  sources:
    gitee:
      clientId: ${JUSTAUTH_GITEE_CLIENT_ID:}
      clientSecret: ${JUSTAUTH_GITEE_CLIENT_SECRET:}
      redirectUri: http://127.0.0.1:8080/system/auth/social-login/gitee
    github:
      clientId: ${JUSTAUTH_GITHUB_CLIENT_ID:}
      clientSecret: ${JUSTAUTH_GITHUB_CLIENT_SECRET:}
      redirectUri: http://127.0.0.1:8080/system/auth/social-login/github


spring:
  mail:
    # 邮箱配置  smtp.qq.com   smtp.163.com
    host: smtp.163.com
    # 邮箱地址
    username: ${MAIL_USERNAME:}
    # 授权码
    password: ${MAIL_PASSWORD:}
