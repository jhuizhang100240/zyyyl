# 项目相关配置
zyyyl:
  # 名称
  name: 智颐云养老
  # 版本
  version: 3.8.5
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/zyyyl/uploadPath，Linux配置 /home/zyyyl/uploadPath）
  profile: ${UPLOAD_PATH:D:/zyyyl/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 指定默认文件上传方法最大文件大小(MB)
  fileMaxSize: 50
  scheduling:
    enabled: ${ZYYYL_SCHEDULING_ENABLED:true}
    task-cron: ${ZYYYL_TASK_CRON:0 0 1 1 * *}
    reservation-cron: ${ZYYYL_RESERVATION_CRON:0 1,31 * * * *}
    contract-cron: ${ZYYYL_CONTRACT_CRON:0 0 1 * * *}

# 微信小程序配置，AppSecret 只从环境变量读取
wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:}

# Dify 配置，Token 只从环境变量读取
dify:
  base-url: ${DIFY_BASE_URL:http://192.168.100.128/v1}
  token: ${DIFY_TOKEN:}
  timeout-seconds: ${DIFY_TIMEOUT_SECONDS:120}
  conversation-limit: ${DIFY_CONVERSATION_LIMIT:20}
  # Dify 工具调用本应用时使用的服务 Token，留空则不校验 Token，仅校验来源IP
  serve-token: ${DIFY_SERVE_TOKEN:}
  serve-allowed-ips:
    - 127.0.0.1
    - ::1
    - 192.168.100.128

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${SERVER_PORT:8080}
  servlet:
    # 应用的访问路径
    context-path: /
    encoding:
      enabled: true
      force: true
      charset: UTF-8
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    "[com.zyyyl]": INFO
    "[org]": WARN
    "[org.springframework]": WARN
    "[org.apache]": WARN
    "[org.springframework.context.support.PostProcessorRegistrationDelegate]": ERROR
    "[com.alibaba.druid.spring.boot3.autoconfigure.stat.DruidSpringAopConfiguration]": ERROR
    "[com.alibaba.druid.spring.boot3.autoconfigure.properties.DruidStatProperties]": ERROR

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10
  ip:
    maxRetryCount: 15
    lockTime: 15

# Spring配置
spring:
  #给项目来个名字
  application:
    name: zyyyl
  cache:
    # 指定缓存类型 simple 默认缓存 jcache 本地缓存 redis 缓存（去plugins配置链接信息）
    type: simple
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: data,auth,pay,plugins,model,apidoc
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:}
  # 令牌有效期（默认1天）
  expireTime: 1440

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1
  
# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

security:
  # 白名单配置，多个用逗号分隔
  whitList: /login,/register,/captchaImage,/error,/swagger-ui/**,/swagger-resources/**,/webjars/**,/druid/**,/*/api-docs/**,/websocket/**

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# 配置数据源和mybatis-flex
mybatis-flex:
  # 搜索指定包别名
  typeAliasesPackage: com.zyyyl.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

aj:
  captcha:
    cache-type: other
    slip-offset: 10
    aes-status: true
    water-mark: "RuoYi-Geek"
